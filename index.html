if(!result){let key=currentKey(),active=sectionNumber(key);h+=`<div class="vote-info"><div class="section-status">${[1,2,3].map(n=>`<span>${esc(n===active?t.sectionActive(n):t.section(n))}</span>`).join('')}</div><div class="section-tabs">${['titles','hiphop','japan'].map((k,i)=>`<button type="button" tabindex="-1" aria-disabled="true" class="section-tab ${i+1===active?'active':''}">${esc(state.lang==='ko'?['타이틀곡','유닛곡','일본곡'][i]:['Title','Unit','Japan'][i])}</button>`).join('')}</div>`;
if(active===2){h+=`<div class="team-tabs">${state.order.filter(k=>k==='hiphop'||k==='vocal'||k==='performance').map(k=>`<button type="button" tabindex="-1" aria-disabled="true" class="team-tab ${k===key?'active':''}">${esc(teamNames[k][state.lang==='ko'?0:1])}</button>`).join('')}</div>`}
let c=count();h+=`<div class="progress-block"><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,100*c.n/c.max))}%"></div></div><div class="progress-caption"><span>${esc(t.progress(key,round()))}</span><span>${esc(t.count(c.n,c.min,c.max))}</span></div></div></div>`}
return h+'</header>'}
function footer(){const t=txt();let right=state.page==='vote'?`<button class="bottom-button" data-action="prev">${esc(t.prev)}</button><button class="bottom-button" data-action="next">${esc(terminal()?t.finish:round()===5?(index()===0||index()===3?t.nextSection:t.nextTeam):t.next)}</button>`:state.page==='done'? '':`<button class="bottom-button" data-action="back">${esc(t.back)}</button>`;return `<footer class="footer"><button class="bottom-button" data-action="language">Language</button><div class="footer-right">${right}</div></footer>`}
function votePage(){const t=txt();return `<main class="content" id="scrollPanel"><div class="song-list">${visibleSongs().map(song=>{let on=picked().includes(song);return `<div class="song-row ${on?'picked':''}"><button type="button" class="song-name" data-song="${esc(song)}" title="${esc(tr(song))}" aria-label="${esc(tr(song))}: ${esc(on?t.cancel:t.select)}" aria-pressed="${on}"><span>${esc(tr(song))}</span></button><button type="button" class="pick-btn" data-song="${esc(song)}" aria-pressed="${on}">${on?esc(t.cancel):esc(t.select)}</button></div>`}).join('')}</div></main>`}
function donePage(){const t=txt();return `<main class="content finished-content" id="scrollPanel"><p class="finished-copy">${esc(t.done)}<br>${esc(t.soon)}</p><section class="finish-option"><h2>${esc(t.mine)}</h2><button data-action="mine">${esc(t.mineSub)}</button></section><section class="finish-option"><h2>${esc(t.leaders)}</h2><button data-action="leaders">${esc(t.leadersSub)}</button></section></main>`}
function resultsPage(){const t=txt(),isMine=state.page==='mine';let keys=categoryKeys;let rows=keys.map(k=>{let value=isMine?(state.choices[state.order.indexOf(k)*5+4]||[])[0]||'-':leaders?.[k]||'—';return `<div class="result-item"><div class="result-key">${esc(categoryNames[k][state.lang==='ko'?0:1])}</div><div class="result-value"><span title="${esc(value==='—'?value:tr(value))}">${esc(value==='—'?value:tr(value))}</span></div></div>`}).join('');let notice=!isMine&&(!BACKEND.url||!BACKEND.anonKey)?`<p style="text-align:center;font-size:12px;color:#9d7081;margin:18px 14px">${esc(t.notConnected)}</p>`:!isMine&&leaders===null?`<p style="text-align:center;font-size:12px;color:#9d7081;margin:18px 14px">${esc(t.loading)}</p>`:'';return `<main class="content result-content" id="scrollPanel"><h1 class="result-heading">${esc(isMine?t.mineHeader:t.leadersHeader)}</h1><div class="result-list">${rows}</div>${notice}${isMine?`<button class="share-btn" data-action="share">${esc(t.share)}</button>`:''}</main>`}
function modalHtml(){if(!modal)return '';let t=txt();let title='',message='',buttons=[];if(modal.type==='language'){title=t.langChoice;buttons=[{title:'한국어',action:'lang-ko',cls:state.lang==='ko'?'language-option selected':'language-option'},{title:'English',action:'lang-en',cls:state.lang==='en'?'language-option selected':'language-option'}]}
if(modal.type==='error'){title=modal.message||t.need;buttons=[{title:t.ok,action:'dismiss',cls:'primary'}]}
if(modal.type==='back'){title=t.previousQuestion;buttons=[{title:t.no,action:'dismiss'},{title:t.yes,action:'prev-confirm',cls:'primary'}]}
if(modal.type==='list'){title=t.chooseList;buttons=[{title:t.only,action:'mode-selected',cls:'primary'},{title:t.all,action:'mode-all'}]}
return `<div class="overlay" data-overlay="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2 style="white-space:pre-line;overflow-wrap:anywhere">${esc(title)}</h2>${message?`<p>${esc(message)}</p>`:''}<div class="modal-actions ${buttons.length===2&&modal.type!=='back'?'column':''}">${buttons.map(b=>`<button class="${b.cls||''}" data-action="${b.action}">${esc(b.title)}</button>`).join('')}</div></div></div>`}
function render(keepScroll=false){const old=$('#scrollPanel'),top=keepScroll&&old?old.scrollTop:0;$('#app').innerHTML=header()+(state.page==='vote'?votePage():state.page==='done'?donePage():resultsPage())+footer()+modalHtml();if(keepScroll&&$('#scrollPanel'))$('#scrollPanel').scrollTop=top;document.documentElement.lang=state.lang;save()}
function toggle(song){if(busy)return;let current=picked(),{max}=count();if(current.includes(song))state.choices[state.step]=current.filter(x=>x!==song);else if(current.length<max)state.choices[state.step]=[...current,song];else{modal={type:'error'};render(true);return}render(true)}
function canAdvance(){const {min,max,n}=count();return n>=min&&n<=max}
function next(){if(!canAdvance()){modal={type:'error'};render(true);return}if(round()<5){modal={type:'list'};render(true);return}advance('all')}
async function advance(mode){modal=null;if(terminal()){await finishVote();return}state.step++;state.choices[state.step]=[];state.modes[state.step]=mode;render()}
function previous(){if(state.step===0){modal={type:'error',message:state.lang==='ko'?'첫 번째 라운드입니다.':'This is the first round.'};render(true)}else{modal={type:'back'};render(true)}}
function confirmPrevious(){const previous=state.step-1;for(const k of Object.keys(state.choices))if(+k>previous)delete state.choices[k];for(const k of Object.keys(state.modes))if(+k>previous)delete state.modes[k];state.step=previous;modal=null;render()}
function pickValues(){return Object.fromEntries(categoryKeys.map(k=>[k,(state.choices[state.order.indexOf(k)*5+4]||[])[0]||'']))}
async function finishVote(){if(busy)return;busy=true;try{if(BACKEND.url&&BACKEND.anonKey&&!state.submitted){const r=await fetch(`${BACKEND.url.replace(/\/$/,'')}/rest/v1/rpc/submit_song_vote`,{method:'POST',headers:{apikey:BACKEND.anonKey,'Content-Type':'application/json'},body:JSON.stringify({ballot_id:state.voteId,picks:pickValues()})});if(!r.ok){let detail='';try{const info=await r.json();detail=[info.code,info.message,info.details].filter(Boolean).join(' · ')}catch(e){detail=await r.text().catch(()=>'')}throw Error(`HTTP ${r.status}${detail?' · '+detail:''}`)}state.submitted=true}state.finished=true;state.page='done';render()}catch(e){console.error('Vote submission failed:',e);const reason=String(e?.message||'Unknown error').slice(0,260);modal={type:'error',message:txt().sendFailure+'\n'+reason};render(true)}finally{busy=false}}
async function fetchLeaders(){leaders=null;render();if(!BACKEND.url||!BACKEND.anonKey)return;try{const r=await fetch(`${BACKEND.url.replace(/\/$/,'')}/rest/v1/rpc/song_vote_leaders`,{headers:{apikey:BACKEND.anonKey}});if(!r.ok)throw Error(r.status);let items=await r.json();leaders={};for(const a of items||[])leaders[a.category]=a.song}catch(e){leaders={}}if(state.page==='leaders')render(true)}
function share(){const v=pickValues(),en=state.lang==='en';let heading=en?'💎 2026 SVTCHIVE — SVT SONG VOTE 101 S2':'💎 2026 셉카이브 배 세븐틴 곡 총선 2';let lines=categoryKeys.map(k=>`${categoryNames[k][en?1:0]} : ${tr(v[k]||'-')}`);const text=[heading,'',...lines,'','참여하러 가기','https://svtchive0526.github.io/seventeen-title-vote/'].join('\n');window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')}
$('#app').addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.song!==undefined){toggle(btn.dataset.song);return}switch(btn.dataset.action){case'language':modal={type:'language'};render(true);break;case'lang-ko':state.lang='ko';modal=null;render(true);break;case'lang-en':state.lang='en';modal=null;render(true);break;case'dismiss':modal=null;render(true);break;case'prev':previous();break;case'prev-confirm':confirmPrevious();break;case'next':next();break;case'mode-selected':advance('selected');break;case'mode-all':advance('all');break;case'mine':state.page='mine';render();break;case'leaders':state.page='leaders';fetchLeaders();break;case'back':state.page='done';render();break;case'share':share();break}});
render();
</script></body></html>
